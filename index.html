<p id="m" style="text-align:center;margin-top:40vh;font-size:22px;font-weight:bold">Opening Sand Shirts Photo Studio…</p>
<script>
fetch('https://script.google.com/macros/s/AKfycbzyM9Pfm3mNLmVuZlnSfkamMASW2JqzirFkAAuUzVmdzupSWJwzmdkgNy6XR7MYLUwJ/exec?src=1',{credentials:'omit'})
